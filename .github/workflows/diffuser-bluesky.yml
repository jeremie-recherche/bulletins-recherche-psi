name: Diffuser les nouveaux bulletins sur Bluesky

on:
  workflow_run:
    workflows: ["Déployer le site"]
    types: [completed]
  workflow_dispatch:
    inputs:
      bulletin_path:
        description: Chemin du bulletin à prévisualiser
        required: true
        default: src/content/bulletins/2026-09-18-preenregistrement-recherche-psi.md
        type: string
      publish:
        description: Publier réellement sur Bluesky
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diffuser:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Déterminer les bulletins à annoncer
        id: bulletins
        shell: bash
        env:
          MANUAL_PATH: ${{ inputs.bulletin_path }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            files="$MANUAL_PATH"
          else
            files=""
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              if ! grep -Eq '^draft:[[:space:]]*false[[:space:]]*$' "$file"; then
                continue
              fi
              if git cat-file -e "HEAD^:$file" 2>/dev/null && \
                 git show "HEAD^:$file" | grep -Eq '^draft:[[:space:]]*false[[:space:]]*$'; then
                continue
              fi
              files+="${files:+$'\n'}$file"
            done < <(git diff --diff-filter=AM --name-only HEAD^ HEAD -- src/content/bulletins/ | grep -E '\.mdx?$' || true)
          fi

          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Préparer ou publier les annonces
        if: steps.bulletins.outputs.files != ''
        shell: bash
        env:
          FILES: ${{ steps.bulletins.outputs.files }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=false
          if [[ "${{ github.event_name }}" == "workflow_run" || "$MANUAL_PUBLISH" == "true" ]]; then
            publish=true
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            if [[ "$publish" == "true" ]]; then
              node scripts/post-bluesky.mjs "$file" --publish
            else
              node scripts/post-bluesky.mjs "$file"
            fi
          done <<< "$FILES"

      - name: Vérifier la connexion sans publier
        if: steps.bulletins.outputs.files == ''
        run: node scripts/check-bluesky.mjs
